<!DOCTYPE html>
<html>
<head>
    <title>MBA Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container mt-4">
        <h1>MBA Test</h1>
        
        <form id="testForm">
            <input type="file" id="csvFile" accept=".csv" class="form-control mb-2">
            <input type="number" id="minSupport" value="0.005" step="0.001" class="form-control mb-2" placeholder="Min Support">
            <input type="number" id="minConfidence" value="0.2" step="0.01" class="form-control mb-2" placeholder="Min Confidence">
            <input type="number" id="minLift" value="1.0" step="0.1" class="form-control mb-2" placeholder="Min Lift">
            <button type="submit" class="btn btn-primary">Analyze</button>
        </form>
        
        <div id="results" class="mt-4"></div>
        
        <canvas id="chart" width="400" height="200"></canvas>
        
        <table id="rulesTable" class="table mt-4">
            <thead>
                <tr><th>Antecedent</th><th>Consequent</th><th>Support</th><th>Confidence</th><th>Lift</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
    document.getElementById('testForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const formData = new FormData();
        formData.append('file', document.getElementById('csvFile').files[0]);
        formData.append('min_support', document.getElementById('minSupport').value);
        formData.append('min_confidence', document.getElementById('minConfidence').value);
        formData.append('min_lift', document.getElementById('minLift').value);
        
        try {
            const response = await fetch('http://127.0.0.1:8000/api/analyze', {
                method: 'POST',
                body: formData
            });
            
            const result = await response.json();
            
            document.getElementById('results').innerHTML = `
                <h3>Results</h3>
                <p>Rules: ${result.rules.length}</p>
                <p>Items: ${result.frequent_items.length}</p>
            `;
            
            // Display rules
            const tbody = document.querySelector('#rulesTable tbody');
            tbody.innerHTML = '';
            result.rules.slice(0, 10).forEach(rule => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${rule.antecedent.join(', ')}</td>
                    <td>${rule.consequent.join(', ')}</td>
                    <td>${rule.support}</td>
                    <td>${rule.confidence}</td>
                    <td>${rule.lift}</td>
                `;
            });
            
            // Display chart
            const ctx = document.getElementById('chart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: result.frequent_items.map(item => item.item),
                    datasets: [{
                        data: result.frequent_items.map(item => item.frequency),
                        backgroundColor: 'rgba(54, 162, 235, 0.8)'
                    }]
                }
            });
            
        } catch (error) {
            document.getElementById('results').innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
        }
    });
    </script>
</body>
</html>
