<!DOCTYPE html>
<html>
<head>
    <title>Frontend Server Test</title>
</head>
<body>
    <h1>✅ Frontend Server is Working!</h1>
    <p>If you can see this page, the frontend server is running correctly.</p>
    <p><a href="index.html">Go to Main Application</a></p>
    <script>
        console.log('Frontend server test page loaded successfully');
        fetch('http://127.0.0.1:8000/health')
            .then(response => response.json())
            .then(data => {
                console.log('✅ Backend connection test:', data);
                document.body.innerHTML += '<p style="color: green;">✅ Backend connection successful!</p>';
            })
            .catch(error => {
                console.error('❌ Backend connection failed:', error);
                document.body.innerHTML += '<p style="color: red;">❌ Backend connection failed. Start backend server.</p>';
            });
    </script>
</body>
</html>
