<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Network Graph Test</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        #networkGraph { width: 100%; height: 400px; border: 1px solid #ddd; margin: 20px 0; }
        .container { max-width: 800px; margin: 0 auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Simple Network Graph Test</h1>
        <p>Testing the simplified network visualization with basic dots and arrows.</p>
        
        <div id="networkGraph"></div>
        
        <button onclick="testSimpleNetwork()">Load Test Data</button>
        
        <h3>Expected Features:</h3>
        <ul>
            <li>Simple blue dots for all items</li>
            <li>Basic gray arrows showing relationships</li>
            <li>Edge labels showing "Lift: value"</li>
            <li>No animations or physics</li>
            <li>Clean, minimal design</li>
        </ul>
    </div>

    <script>
        function testSimpleNetwork() {
            const rules = [
                {
                    "antecedent": ["Bread"],
                    "consequent": ["Butter"],
                    "lift": 1.4
                },
                {
                    "antecedent": ["Milk"],
                    "consequent": ["Cookies"],
                    "lift": 2.1
                },
                {
                    "antecedent": ["Bread", "Butter"],
                    "consequent": ["Jam"],
                    "lift": 1.8
                },
                {
                    "antecedent": ["Coffee"],
                    "consequent": ["Sugar"],
                    "lift": 1.6
                }
            ];

            renderSimpleNetworkGraph(rules);
        }

        function renderSimpleNetworkGraph(rules) {
            const nodes = [];
            const edges = [];
            const nodeSet = new Set();
            
            // Collect all unique items
            rules.forEach(rule => {
                rule.antecedent.forEach(item => nodeSet.add(item));
                rule.consequent.forEach(item => nodeSet.add(item));
            });
            
            // Create simple nodes
            nodeSet.forEach(item => {
                nodes.push({
                    id: item,
                    label: item
                });
            });
            
            // Create simple edges
            rules.forEach(rule => {
                rule.antecedent.forEach(a => {
                    rule.consequent.forEach(c => {
                        if (a !== c) {
                            edges.push({
                                from: a,
                                to: c,
                                width: 2,
                                label: "Lift: " + rule.lift.toFixed(2)
                            });
                        }
                    });
                });
            });
            
            const container = document.getElementById("networkGraph");
            const data = {
                nodes: new vis.DataSet(nodes),
                edges: new vis.DataSet(edges)
            };
            
            const options = {
                nodes: {
                    shape: "dot",
                    size: 12,
                    color: "#4a90e2"
                },
                edges: {
                    arrows: "to",
                    color: "#444"
                },
                physics: false
            };
            
            new vis.Network(container, data, options);
            console.log('Simple network created with', nodes.length, 'nodes and', edges.length, 'edges');
        }

        // Auto-load test data
        window.onload = function() {
            testSimpleNetwork();
        };
    </script>
</body>
</html>
